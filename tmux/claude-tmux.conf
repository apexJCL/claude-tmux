# ── Claude Code quota indicator ─────────────────────────────────────────────
# ~/.local/bin/tmux-claude-widget renders one badge per quota window, reading
# state that any Claude session writes via its statusLine command (see
# ~/.claude/settings.json). It is session- and pane-agnostic: no session running
# just means the last known figures, corrected for any window that has since
# reset, and it prints nothing at all if none has ever reported.
#   top row    -- 5h session usage + time left (right-aligned by tmux-two-row-status)
#   bottom row -- weekly usage + reset date, after tmux2k's segments
# The bottom one must come after tpm, since tmux2k builds status-right when it loads.
#
# With several accounts (one CLAUDE_CONFIG_DIR each), the badges show the account
# Claude runs in the active pane, drawn inverted, else the pinned one (default
# "personal"). prefix + Q picks the pin and toggles following the pane; or set
# @claude-quota-pin / @claude-quota-auto (on|off) yourself.
set -g status-right-length 150
set -ga status-right "#(~/.local/bin/tmux-claude-widget week '#80FFEA' '#{pane_id}' '#{@claude-quota-pin}' '#{@claude-quota-auto}' '#{pane_pid}')"
set -g @status-top-right "#(~/.local/bin/tmux-claude-widget session '#0B0D0F' '#{pane_id}' '#{@claude-quota-pin}' '#{@claude-quota-auto}' '#{pane_pid}')"
# -b: display-menu only returns once the menu closes.
bind-key Q run-shell -b '~/.local/bin/tmux-claude-menu #{client_name}'

# Tell accounts apart: a colour scheme (orange yellow green cyan pink, or
# "#base,#fill") and/or a glyph replacing the sparkle logo, per account name.
# set -g @claude-quota-scheme-work green
# set -g @claude-quota-icon-work '󰮿'   # U+F0BBF

# Give the window list its own row above the tmux2k bar, so the main row isn't
# competing for the centre. Idempotent -- safe on every reload.
run-shell '~/.local/bin/tmux-two-row-status'
