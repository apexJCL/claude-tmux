schema: spec-driven

context: |
  Bash scripts for a tmux status badge showing Claude Code subscription quota.
  bin/claude-tmux-status (Claude Code statusLine command, writes ~/.cache/claude-tmux/quota*),
  bin/tmux-claude-widget (renders the badge), bin/tmux-two-row-status (two-row tmux layout).
  Dependencies: bash 4.2+, jq, tmux, Nerd Font glyphs. Name glyphs by codepoint in specs and tests.
  Tests: tests/run.sh, one check per spec scenario; every change adds or updates checks.
  Commits: type(scope): description.

